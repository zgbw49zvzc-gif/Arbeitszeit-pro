<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitszeit Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>Arbeitszeit Pro</h1>

<div class="card">

<h2>Heute</h2>

<p>
Arbeitszeit:
<strong id="workTime">0:00</strong>
</p>

<p>

</div>


<div class="buttons">

<button id="startButton">
🟢 Kommen
</button>


<button id="stopButton">
🔴 Gehen
</button>

</div>


</div>


<script src="app.js"></script>
