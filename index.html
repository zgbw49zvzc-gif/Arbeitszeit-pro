<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitszeit Pro</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="app">

<header>
    <h1>Arbeitszeit Pro</h1>
    <p id="heute"></p>
</header>


<nav class="navigation">

<button onclick="zeigeSeite('dashboard')">
🏠
<span>Home</span>
</button>

<button onclick="zeigeSeite('zeit')">
⏱
<span>Zeit</span>
</button>

<button onclick="zeigeSeite('kalender')">
📅
<span>Kalender</span>
</button>

<button onclick="zeigeSeite('einstellungen')">
⚙️
<span>Setup</span>
</button>

</nav>



<section id="dashboard" class="seite aktiv">


<div class="karte">

<h2>Status</h2>

<p id="status">
Bereit
</p>

</div>



<div class="karte">

<h2>Heute</h2>

<div class="zeile">
<span>Arbeitszeit</span>
<strong id="arbeitszeit">
0:00
</strong>
</div>


<div class="zeile">
<span>Saldo</span>
<strong id="saldo">
0:00
</strong>
</div>


<div class="zeile">
<span>Zeitkonto</span>
<strong id="zeitkonto">
0:00
</strong>
</div>

</div>


</section>






<section id="zeit" class="seite">


<div class="karte">

<h2>Zeiterfassung</h2>


<button class="start" onclick="kommen()">
🟢 Kommen
</button>


<button class="stop" onclick="gehen()">
🔴 Gehen
</button>


</div>


<div class="karte">

<h2>Manueller Eintrag</h2>


<label>Art</label>

<select id="art">

<option>Arbeitszeit</option>
<option>Urlaub</option>
<option>Krankheit</option>
<option>Lehrgang</option>
<option>Schulung</option>
<option>Reisezeit</option>
<option>Überstundenabbau</option>

</select>



<label>Stunden</label>

<input id="stunden" type="number" step="0.25">


<label>Notiz</label>

<input id="notiz" type="text">


<button onclick="speichern()">
💾 Speichern
</button>


</div>


</section>






<section id="kalender" class="seite">


<div class="karte">

<h2>Kalender</h2>

<div id="kalenderInhalt">

Noch keine Einträge

</div>

</div>


</section>







<section id="einstellungen" class="seite">


<div class="karte">

<h2>Einstellungen</h2>


<label>Sollzeit pro Tag</label>

<input id="sollzeit" value="7">


<label>Pause in Minuten</label>

<input id="pause" value="45">


<button onclick="speichereEinstellungen()">
Speichern
</button>


</div>


</section>



</div>


<script src="storage.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>


</body>
</html>
