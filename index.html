<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitszeit Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<div class="app">


<header>

<h1>Arbeitszeit Pro</h1>

<p id="datum"></p>

</header>




<section class="karte">

<h2>Heute</h2>


<div class="zeile">
<span>Arbeitszeit</span>
<strong id="arbeitszeit">0:00</strong>
</div>


<div class="zeile">
<span>Tagessaldo</span>
<strong id="saldo">0:00</strong>
</div>


<div class="zeile">
<span>Status</span>
<strong id="status">Bereit</strong>
</div>


</section>





<div class="buttons">

<button id="kommen">
🟢 Kommen
</button>


<button id="gehen">
🔴 Gehen
</button>

</div>







<section class="karte">


<h2>Zeitkonto</h2>


<div class="zeile">

<span>Überstunden</span>

<strong id="zeitkonto">
0:00
</strong>

</div>


</section>








<section class="karte">


<h2>Neuer Eintrag</h2>


<label>Datum</label>

<input 
type="date"
id="datumEintrag">



<label>Art</label>

<select id="artEintrag">

<option>Arbeitszeit</option>
<option>Lehrgang</option>
<option>Schulung</option>
<option>Reisezeit</option>
<option>Urlaub</option>
<option>Krankheit</option>
<option>Überstundenabbau</option>

</select>



<label>Zeit in Stunden</label>

<input

type="number"

id="zeitEintrag"

step="0.25"

placeholder="z.B. 7">


<label>Bemerkung</label>

<input

type="text"

id="notizEintrag"

placeholder="Beschreibung">



<button id="speichern">

💾 Eintrag speichern

</button>



</section>








<section class="karte">


<h2>Verlauf</h2>


<div id="liste">

<p>Noch keine Einträge</p>

</div>


</section>






</div>







<script src="database.js"></script>

<script src="app.js"></script>




<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>



</body>

</html>
