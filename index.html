<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitszeit Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<div class="app">


<header>

<h1>Arbeitszeit Pro</h1>

<p id="datum"></p>

</header>



<section class="karte">

<h2>Heute</h2>


<div class="zeile">
<span>Arbeitszeit</span>
<strong id="arbeitszeit">0:00</strong>
</div>


<div class="zeile">
<span>Tagessaldo</span>
<strong id="saldo">0:00</strong>
</div>


<div class="zeile">
<span>Status</span>
<strong id="status">
Nicht gestartet
</strong>
</div>


</section>




<section class="buttons">

<button id="kommen">
🟢 Kommen
</button>


<button id="gehen">
🔴 Gehen
</button>


</section>





<section class="karte">


<h2>Zeitkonto</h2>


<div class="zeile">

<span>Überstunden</span>

<strong id="zeitkonto">
0:00
</strong>

</div>


</section>





<section class="karte">


<h2>Letzte Arbeitstage</h2>


<div id="tage">

<p>Noch keine Einträge</p>

</div>


</section>




</div>



<script src="database.js"></script>

<script src="app.js"></script>


<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>



</body>

</html>
