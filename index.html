<section class="card">

<h2>Manueller Eintrag</h2>

<label>Art</label>

<select id="art">

<option value="Arbeit">Arbeitszeit</option>
<option value="Urlaub">Urlaub</option>
<option value="Krankheit">Krankheit</option>
<option value="Lehrgang">Lehrgang</option>
<option value="Schulung">Schulung</option>
<option value="Reisezeit">Reisezeit</option>
<option value="Überstundenabbau">Überstundenabbau</option>

</select>

<label>Stunden (Dezimal)</label>

<input
type="number"
id="stunden"
step="0.25"
placeholder="z. B. 7.50">

<label>Bemerkung</label>

<input
type="text"
id="bemerkung"
placeholder="Optional">

<button id="speichernButton">

💾 Eintrag speichern

</button>

</section>



<section class="card">

<h2>Verlauf</h2>

<table>

<thead>

<tr>

<th>Datum</th>
<th>Art</th>
<th>Stunden</th>

</tr>

</thead>

<tbody id="verlauf">

<tr>

<td colspan="3">

Keine Einträge vorhanden

</td>

</tr>

</tbody>

</table>

</section>



<section class="card">

<h2>Einstellungen</h2>

<label>Sollarbeitszeit</label>

<input
type="number"
id="sollstunden"
step="0.25"
value="7">

<label>Automatische Pause (Minuten)</label>

<input
type="number"
id="pausenzeit"
value="45">

<button id="einstellungenSpeichern">

⚙️ Einstellungen speichern

</button>

</section>

</div>

<script src="storage.js"></script>
<script src="app.js"></script>

</body>
</html>
