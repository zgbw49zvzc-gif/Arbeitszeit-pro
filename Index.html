<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arbeitszeit Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

    <header>
        <h1>Arbeitszeit Pro</h1>
        <p id="date"></p>
    </header>


    <section class="card">

        <h2>Heute</h2>

        <div class="info">
            <span>Arbeitszeit</span>
            <strong id="workTime">0:00</strong>
        </div>


        <div class="info">
            <span>Überstunden</span>
            <strong id="overtime">0:00</strong>
        </div>


        <div class="info">
            <span>Status</span>
            <strong id="status">Nicht gestartet</strong>
        </div>

    </section>



    <section class="buttons">

        <button id="startButton">
            🟢 Kommen
        </button>


        <button id="stopButton">
            🔴 Gehen
        </button>

    </section>



    <section class="card">

        <h2>Einstellungen</h2>

        <p>
            Sollzeit:
            <strong>7 Stunden</strong>
        </p>

        <p>
            Pause:
            <strong>45 Minuten</strong>
        </p>

    </section>


</div>


<script src="app.js"></script>

</body>
</html>
